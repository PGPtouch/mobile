name: mobile
description: Mobile client for the PGPtouch protocol that includes various additional features.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  dart_pg: ^2.1.0
  bluetooth_low_energy: ^6.2.1
  bluetooth_low_energy_android: any
  nfc_util: ^3.3.0
  shared:
    git: https://github.com/PGPtouch/shared.git
  device_info_plus: ^13.3.0
  permission_handler: ^13.0.2
  open_settings_plus: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  bluetooth_low_energy_android:
    git: https://github.com/PGPtouch/bluetooth_low_energy_android.git
